[project]
name = "comparator-recommender"
version = "0.0.1"
description = "Groundworkers plugin for recommending comparator cohorts."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "groundworkers[tui]>=0.5,<1",
  "oa-configurator>=1.2.1,<2",
  "omop-emb>=2.1,<3",
  "omop-llm>=1,<2",
  "pandas>=3",
  "pgvector>=0.5,<1",
  "pydantic>=2,<3",
  "SQLAlchemy>=2,<3",
]

[project.entry-points."omop.config"]
comparator_recommender = "comparator_recommender.config:ComparatorRecommenderConfig"

[project.entry-points."groundworkers.plugins"]
comparator_recommender = "comparator_recommender.plugin:plugin"

[dependency-groups]
dev = [
  "groundskeeping>=0.6.1,<1",
  "pytest>=9,<10",
  "ruff>=0.4",
  "ty>=0.0.59",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/comparator_recommender"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "RUF"]

[tool.ty.src]
include = ["src"]
